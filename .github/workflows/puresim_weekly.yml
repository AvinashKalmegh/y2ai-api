name: PureSim Universe Weekly Review (Saturday)

# DEPRECATED 2026-06-28: the weekly PureSim_Universe push now runs from FlowOS
# (puresim.tasks.weekly_review -> push_universe_review, sourced from
# market_data.pure_sim_universe). The Saturday schedule is disabled here to stop
# double-writes to the same tab. workflow_dispatch is kept for manual fallback only.
on:
  # schedule:
  #   # Saturday 3:00 AM ET (07:00 UTC) — moved to FlowOS Celery beat.
  #   - cron: "0 7 * * 6"
  workflow_dispatch: {}

jobs:
  run-puresim-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: America/New_York
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Google credentials.json
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: "PureSim Universe: DM Crossover Hit Rate (3yr lookback)"
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          echo "========================================"
          echo "PURESIM UNIVERSE WEEKLY REVIEW"
          echo "Lookback: trailing 3 years"
          echo "Started at $(date)"
          echo "========================================"
          python files_3/dm_crossover_hitrate.py --years 3 --push

      - name: Log completion
        if: always()
        run: |
          echo "========================================"
          echo "PureSim Weekly Review completed at $(date)"
          echo "========================================"
