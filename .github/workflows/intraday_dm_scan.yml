name: Intraday DM Scanner (3x Daily)

on:
  schedule:
    # Scheduled 2 hours earlier than target to compensate for GitHub Actions cron delay.
    # Target 10:30 AM ET → fire 8:30 AM ET (12:30 UTC, 13:30 UTC during EST)
    - cron: "30 12 * * 1-5"
    # Target 1:00 PM ET → fire 11:00 AM ET (15:00 UTC, 16:00 UTC during EST)
    - cron: "0 15 * * 1-5"
    # Target 3:30 PM ET → fire 1:30 PM ET (17:30 UTC, 18:30 UTC during EST)
    - cron: "30 17 * * 1-5"
  workflow_dispatch:
    inputs:
      universe:
        description: "Ticker universe to scan"
        required: false
        default: "priority"
        type: choice
        options:
          - priority
          - marketplace
          - flowos

jobs:
  intraday-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: America/New_York
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Google credentials.json
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run Intraday DM Scan
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          UNIVERSE="${{ github.event.inputs.universe || 'priority' }}"
          echo "========================================"
          echo "INTRADAY DM SCAN"
          echo "Universe: $UNIVERSE"
          echo "Started at $(date)"
          echo "========================================"

          if [ "$UNIVERSE" = "marketplace" ]; then
            python intraday_dm_scanner.py --marketplace
          elif [ "$UNIVERSE" = "flowos" ]; then
            python intraday_dm_scanner.py --flowos
          else
            python intraday_dm_scanner.py
          fi

      - name: Log completion
        if: always()
        run: |
          echo "========================================"
          echo "Intraday DM Scan completed at $(date)"
          echo "========================================"
