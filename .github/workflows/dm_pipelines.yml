name: DM Daily Data Pipelines (Post-Market)

on:
  schedule:
    # 5:00 PM ET (22:00 UTC) weekdays — ~1hr after market close
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

jobs:
  run-data-pipelines:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: America/New_York
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

    steps:
      # ── Setup ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Google credentials.json
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      # ════════════════════════════════════════════════════════
      # DM PIPELINE (~2 min with Polygon grouped daily + calc)
      # ════════════════════════════════════════════════════════

      - name: "DM Pipeline 1/2: Fetch prices + Calculate DM"
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          echo "========================================"
          echo "DM HISTORICAL — Daily Update (Polygon, ~2 min)"
          echo "Started at $(date)"
          echo "========================================"
          python Dm_historical_pipeline.py daily
        continue-on-error: true
        

      - name: "DM Pipeline 2/2: Push DM Latest + History to Sheets"
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          echo "========================================"
          echo "DM PUSH TO SHEETS"
          echo "========================================"
          python Dm_push_to_sheet.py daily
        continue-on-error: true

      - name: "DM Pipeline checkpoint"
        if: always()
        run: |
          echo "DM Pipeline completed at $(date)"

      # ════════════════════════════════════════════════════════
      # HMS PIPELINE (runs after DM so price_history is current)
      # ════════════════════════════════════════════════════════

      - name: "HMS Pipeline: Calculate HMS + Push to Supabase & Sheets"
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          echo "========================================"
          echo "HMS DAILY — Calculate + Push (52 tickers)"
          echo "Started at $(date)"
          echo "========================================"
          python hms_calculator.py
        continue-on-error: true

      - name: "HMS Pipeline checkpoint"
        if: always()
        run: |
          echo "HMS Pipeline completed at $(date)"

      # ════════════════════════════════════════════════════════
      # SUMMARY
      # ════════════════════════════════════════════════════════

      - name: Log completion
        if: always()
        run: |
          echo "========================================"
          echo "All Pipelines completed at $(date)"
          echo "========================================"
          echo ""
          echo "Pipelines executed:"
          echo "  DM Historical  — Polygon (price fetch + DM calc)"
          echo "  DM Push        — Push DM Latest + History to Sheets"
          echo "  HMS Daily      — Calculate HMS + Push to Supabase & Sheets"
          echo "========================================"