name: Credit Divergence Daily (Morning)

on:
  schedule:
    # 9:00 AM ET (14:00 UTC) weekdays — after credit spreads and DM are updated
    - cron: "0 14 * * 1-5"
  workflow_dispatch: {}

jobs:
  run-credit-divergence:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: America/New_York
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Credit Divergence: Scan Equity vs Credit + Push to Supabase"
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          echo "========================================"
          echo "CREDIT DIVERGENCE — Daily Scan (Morning)"
          echo "Started at $(date)"
          echo "========================================"
          python credit_divergence.py daily

      - name: Log completion
        if: always()
        run: |
          echo "========================================"
          echo "Credit Divergence Pipeline completed at $(date)"
          echo "========================================"
