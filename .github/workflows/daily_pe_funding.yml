name: Daily PE Funding Update (5x per day)

on:
  schedule:
    # Same schedule as private capital
    # 4:00 AM ET  -> 09:00 UTC  (Pre-market overnight)
    # 8:00 AM ET  -> 13:00 UTC  (Pre-market buzz)
    # 12:00 PM ET -> 17:00 UTC  (Midday)
    # 5:00 PM ET  -> 22:00 UTC  (After close)
    # 9:00 PM ET  -> 02:00 UTC  (After-hours)
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 22 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:  # Allow manual trigger

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

jobs:
  run-pe-funding:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install feedparser

      - name: Setup Google Sheets credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run PE Funding Update
        run: |
          echo "Starting PE Funding update..."
          python -m orchestrator --pe-funding
          echo "PE Funding update complete"

      - name: Summary
        if: always()
        run: |
          echo "## PE Funding Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Alerts: Mega Rounds, Series A/B, Late Stage, IPO Pipeline, VC Fund Launches" >> $GITHUB_STEP_SUMMARY
          echo "- Sectors: Emergent from data (AI, Fintech, Healthtech, Climate, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "- Storage: Supabase (pe_funding_*) + Google Sheets (PE_Funding_Dial)" >> $GITHUB_STEP_SUMMARY