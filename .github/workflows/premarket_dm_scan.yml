name: Pre-Market DM Scan (7:30 AM ET)

on:
  schedule:
    # 7:30 AM ET = 11:30 UTC (12:30 UTC during EST)
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}

jobs:
  premarket-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: America/New_York
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Google credentials.json
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run Pre-Market DM Scan
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          echo "========================================"
          echo "PRE-MARKET DM SCAN"
          echo "Started at $(date)"
          echo "========================================"
          python premarket_dm_scan.py

      - name: Log completion
        if: always()
        run: |
          echo "========================================"
          echo "Pre-Market DM Scan completed at $(date)"
          echo "========================================"
