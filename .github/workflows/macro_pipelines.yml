name: Macro & Market Data Pipelines (Post-Market)

on:
  schedule:
    # 5:00 PM ET (22:00 UTC) weekdays — same time as DM, runs in parallel
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

env:
  TZ: America/New_York
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
  PYTHONPATH: "."

jobs:
  # ════════════════════════════════════════════════════════
  # 1. MACRO HISTORY (FRED)
  # ════════════════════════════════════════════════════════
  macro-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: "Macro History — Daily Update"
        run: python Macro_Options/macro_pipeline.py daily
        continue-on-error: true

      - name: "Macro History — Push to Sheets"
        run: python Macro_Options/macro_pipeline.py push
        continue-on-error: true

  # ════════════════════════════════════════════════════════
  # 2. OPTIONS PUT/CALL (Polygon)
  # ════════════════════════════════════════════════════════
  options-putcall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: "Options Put/Call — Daily Update"
        run: python Macro_Options/options_pipeline.py daily
        continue-on-error: true

      - name: "Options Put/Call — Push to Sheets"
        run: python Macro_Options/options_pipeline.py push
        continue-on-error: true

  # ════════════════════════════════════════════════════════
  # 3. SHORT VOLUME (FINRA)
  # ════════════════════════════════════════════════════════
  short-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: "Short Volume — Daily Update"
        run: python Short_Volume/short_volume.py daily
        continue-on-error: true

      - name: "Short Volume — Push to Sheets"
        run: python Short_Volume/short_volume.py push
        continue-on-error: true

  # ════════════════════════════════════════════════════════
  # 4. SHORT INTEREST (Polygon)
  # ════════════════════════════════════════════════════════
  short-interest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: "Short Interest — Daily Update"
        run: python Short_Interest/short_interest_pipeline.py daily
        continue-on-error: true

      - name: "Short Interest — Push to Sheets"
        run: python Short_Interest/short_interest_pipeline.py push
        continue-on-error: true

  # ════════════════════════════════════════════════════════
  # 5. INSIDER TRANSACTIONS (Finnhub) — slowest ~10 min
  # ════════════════════════════════════════════════════════
  insider-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: "Insider Transactions — Daily Update"
        run: python Insider_Transactions/insider_transactions.py daily
        continue-on-error: true

      - name: "Insider Transactions — Push to Sheets"
        run: python Insider_Transactions/insider_transactions.py push
        continue-on-error: true

  # ════════════════════════════════════════════════════════
  # 6. EARNINGS CALENDAR (Finnhub)
  # ════════════════════════════════════════════════════════
  earnings-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: "Earnings Calendar — Daily Update"
        run: python Earnings_Calendar/earnings_calendar.py daily
        continue-on-error: true

      - name: "Earnings Calendar — Push to Sheets"
        run: python Earnings_Calendar/earnings_calendar.py push
        continue-on-error: true

  # ════════════════════════════════════════════════════════
  # 7. ETF NET FLOWS (yfinance — free, no key needed)
  # ════════════════════════════════════════════════════════
  etf-net-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: "ETF Net Flows — Daily Update"
        run: python ETF_Pipeline/etf_pipeline.py daily
        continue-on-error: true

      - name: "ETF Net Flows — Push to Sheets"
        run: python ETF_Pipeline/etf_pipeline.py push
        continue-on-error: true
